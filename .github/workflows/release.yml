name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Packages
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enable Long Path Support
        run: |
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1

      - name: Install Playwright browsers (Bundled)
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "0"
          python -m playwright install chromium

      - name: Build with PyInstaller (ONEDIR)
        run: |
          pyinstaller --noconfirm FBPoster.spec

      - name: Prune redundant browser binaries
        run: |
          Remove-Item -Recurse -Force "dist\FBPoster\_internal\playwright\driver\package\.local-browsers\chromium_headless_shell-*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist\FBPoster\_internal\playwright\driver\package\.local-browsers\ffmpeg-*" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "dist\FBPoster\_internal\playwright\driver\package\.local-browsers\winldd-*" -ErrorAction SilentlyContinue

      - name: Create Portable ZIP
        run: |
          Compress-Archive -Path "dist\FBPoster\*" -DestinationPath "dist\FBPoster-Windows-Portable.zip"

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Build Installer (Inno Setup)
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          $distPath = (Resolve-Path "dist\FBPoster").Path
          & $iscc "/DAppSourceDir=$distPath" packaging\windows\installer.iss

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/FBPoster-Setup.exe
            dist/FBPoster-Windows-Portable.zip
          draft: false
          prerelease: false
          generate_release_notes: true

  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Linux package
        run: |
          chmod +x scripts/build_linux.sh
          ./scripts/build_linux.sh --onedir
          tar -czvf dist/FBPoster-Linux-x86_64.tar.gz -C dist FBPoster

      - name: Upload Linux Artifact to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist/FBPoster-Linux-x86_64.tar.gz
          draft: false
          prerelease: false
